name: Check fixed candidate
on:
  pull_request:
    paths: ['submissions/*.json']
permissions:
  contents: read
  pull-requests: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Inspect candidate without executing plugin code
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 market/scripts/github_market.py candidate "$PR_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-candidate
          path: candidate/
          retention-days: 30
          if-no-files-found: error
